<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>记次 · 效果图</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --card:#F5F5F5; --card-2:#EDEDED;
    --ink:#0B0B0B; --ink-2:#6B6B6B; --ink-3:#9C9C9C; --line:#E7E7E7;
    --font:-apple-system,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;}
  .screen{position:relative;width:1280px;height:800px;background:var(--bg);overflow:hidden;}

  .top{position:absolute;top:32px;left:44px;display:flex;align-items:center;gap:10px;}
  .top .name{font-size:17px;font-weight:600;letter-spacing:-.3px;}

  .corner{position:absolute;top:26px;right:44px;display:flex;gap:10px;}
  .tool{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink);}

  .clock{
    position:absolute;left:0;top:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(54px,7.4vw,96px);font-weight:550;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
  }

  /* 右侧记次面板 */
  .laps{
    position:absolute;right:44px;top:50%;transform:translateY(-50%);
    width:320px;max-height:460px;
    background:var(--card);border-radius:22px;
    padding:18px 20px 14px;
    display:flex;flex-direction:column;
  }
  .laps-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;}
  .laps-head b{font-size:13px;font-weight:600;letter-spacing:.2px;color:var(--ink-2);}
  .laps-head span{font-size:11.5px;color:var(--ink-3);}

  .lap{
    display:flex;align-items:center;gap:10px;
    padding:11px 0;border-top:1px solid var(--line);
    font-variant-numeric:tabular-nums;
  }
  .lap:first-of-type{border-top:0;}
  .no{
    width:20px;height:20px;border-radius:6px;flex:none;
    background:var(--card-2);color:var(--ink-2);
    font-size:10.5px;font-weight:600;display:grid;place-items:center;
  }
  .iv{flex:1;font-size:19px;font-weight:600;letter-spacing:-.4px;}
  .cu{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}

  .live{
    margin-top:8px;padding:13px 14px;border-radius:14px;
    background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .live .lb{font-size:11px;color:var(--ink-3);letter-spacing:.6px;}
  .live .lv{font-size:20px;font-weight:650;letter-spacing:-.4px;font-variant-numeric:tabular-nums;}

  .actions{position:absolute;left:44px;bottom:44px;display:flex;gap:10px;}
  .lapbtn{
    position:absolute;right:44px;bottom:44px;
    height:58px;padding:0 26px;border-radius:999px;
    background:var(--ink);color:#fff;
    display:flex;align-items:center;gap:9px;
    font-size:15px;font-weight:550;letter-spacing:.3px;
    box-shadow:none;
  }
  .lapbtn svg{opacity:.92;}
</style>
</head>
<body>
<div class="screen">

  <div class="top"><span class="name">资料分析</span></div>

  <div class="corner">
    <div class="tool">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="13" rx="2.5"/><path d="M8.5 20.5h7"/><circle cx="12" cy="11" r="2.6"/></svg>
    </div>
    <div class="tool">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="5.2" width="17.6" height="13.6" rx="3"/><circle cx="8.6" cy="10.2" r="1.5"/><path d="M4 16.6l4.6-4.2a1.6 1.6 0 0 1 2.1 0l2.6 2.3 1.9-1.6a1.6 1.6 0 0 1 2.1 0l2.7 2.4"/></svg>
    </div>
    <div class="tool">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 14.6A8.2 8.2 0 1 1 9.4 3.8a6.6 6.6 0 0 0 10.8 10.8z"/></svg>
    </div>
  </div>

  <div class="clock">01:07:09</div>

  <div class="laps">
    <div class="laps-head"><b>记次</b><span>3 次</span></div>

    <div class="lap"><span class="no">3</span><span class="iv">20:15</span><span class="cu">00:59:57</span></div>
    <div class="lap"><span class="no">2</span><span class="iv">19:42</span><span class="cu">00:39:42</span></div>
    <div class="lap"><span class="no">1</span><span class="iv">20:00</span><span class="cu">00:20:00</span></div>

    <div class="live">
      <span class="lb">距离上次记次</span>
      <span class="lv">07:12</span>
    </div>
  </div>

  <div class="actions">
    <div class="tool">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5.5" width="3.4" height="13" rx="1.2"/><rect x="13.6" y="5.5" width="3.4" height="13" rx="1.2"/></svg>
    </div>
    <div class="tool" style="color:#E03A2F">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.4"/></svg>
    </div>
  </div>

  <div class="lapbtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 5h11l-2 3.5 2 3.5H5"/></svg>
    记次
  </div>

</div>
</body>
</html>
