<!doctype html>
<html><head><meta charset="utf-8"><title>seed</title></head>
<body><pre id="o">seeding...</pre>
<script>
// 演示用假数据（考研），不包含任何真实使用者信息
const now = Date.now(), D = 86400000;
const todos = [
  { id: 'a1', name: '高数强化',   createdAt: now - 40 * D },
  { id: 'a2', name: '线代习题',   createdAt: now - 38 * D },
  { id: 'a3', name: '概率论',     createdAt: now - 30 * D },
  { id: 'a4', name: '英语真题',   createdAt: now - 25 * D },
  { id: 'a5', name: '政治马原',   createdAt: now - 16 * D },
  { id: 'a6', name: '408 数据结构', createdAt: now - 9 * D },
];
let seed = 2027;
const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
const sessions = [];
for (let d = 1; d < 21; d++) {
  const base = new Date(now - d * D);
  base.setHours(7, 30, 0, 0);
  const n = 1 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const t = todos[Math.floor(rnd() * todos.length)];
    const start = base.getTime() + (i * 3 + Math.floor(rnd() * 3)) * 3600000;
    const dur = Math.round((25 + rnd() * 65) * 60000);
    if (start + dur > now - 90000) continue;
    const pauses = rnd() > 0.75 ? [[start + dur * 0.4, start + dur * 0.4 + 150000]] : [];
    sessions.push({ id: 's' + d + '_' + i, todoId: t.id, start, end: start + dur, pauses });
  }
}
// 今天的固定数据，让扇形图有多个代办
const t0 = new Date(); t0.setHours(7, 30, 0, 0);
const base0 = t0.getTime();
[
  ['a1', 0, 61],
  ['a4', 2.5, 45],
  ['a5', 6.5, 30],
  ['a6', 9, 25],
].forEach(function (r, i) {
  const start = base0 + r[1] * 3600000;
  const end = start + r[2] * 60000;
  if (end < now - 600000) sessions.push({ id: 'td' + i, todoId: r[0], start, end, pauses: [] });
});
localStorage.setItem('timelog.db.v1', JSON.stringify({ todos, sessions }));
const q = new URLSearchParams(location.search);
if (q.has('cur')) {
  localStorage.setItem('timelog.current.v1', JSON.stringify({
    todoId: 'a1',
    start: now - 27 * 60000,
    pauses: [[now - 9 * 60000, now - 8 * 60000]],
    laps: [20 * 60000],
    pausedAt: q.has('pause') ? now - 42000 : null,
  }));
} else {
  localStorage.removeItem('timelog.current.v1');
}
document.getElementById('o').textContent = 'seeded ' + sessions.length + ' sessions / ' + todos.length + ' todos';
</script>
</body></html>
