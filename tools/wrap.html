<!doctype html>
<html><head><meta charset="utf-8"><title>wrap</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head><body>
<iframe id="f" src="../web/index.html#screen=todos"></iframe>
<script>
const p = new URLSearchParams(location.search);
const f = document.getElementById('f');
const sel = (p.get('click') || '').split(',')[0];
const sel2 = () => (p.get('click') || '').split(',')[1];
let tries = 0;
function tick() {
  if (!sel) return;
  const doc = f.contentDocument;
  const el = doc && doc.querySelector(sel);
  if (el) { el.click(); const s2 = sel2(); if (s2) setTimeout(() => { const e2 = f.contentDocument.querySelector(s2); if (e2) e2.click(); }, 120); return; }
  if (++tries < 40) setTimeout(tick, 100);
}
f.addEventListener('load', () => setTimeout(tick, 200));
</script>
</body></html>
